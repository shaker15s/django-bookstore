{% load static %}
<div class="product card mb-4">
    {% if product.image %}
    <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}" style="height:220px; object-fit:cover;" />
    {% else %}
    <img src="https://picsum.photos/seed/{{ product.id }}book/300/220" class="card-img-top" alt="{{ product.name }}" style="height:220px; object-fit:cover;" />
    {% endif %}
    <div class="card-img-overlay d-flex flex-column align-items-center justify-content-center">
        <a class="btn btn-primary shadow-sm mb-2" href="{% url 'store:add-to-cart' pid=product.id %}">
            <i class="fa-solid fa-cart-plus me-1"></i> إضافة للسلة
        </a>
        <a class="btn btn-light text-primary shadow-sm" href="{% url 'store:product' pid=product.id %}">
            <i class="fa-solid fa-eye me-1"></i> عرض التفاصيل
        </a>
    </div>
    <div class="card-body">
        <h6 class="text-muted small">{% if product.author %}{{ product.author.name }}{% else %}بدون كاتب{% endif %}</h6>
        <h6 class="card-title fw-bold">{{ product.name }}</h6>
        <strong class="fw-bold" style="color:var(--primary-color);">{{ product.price }}$</strong>
    </div>
</div>
