{% load static %}
<!DOCTYPE html>
<html lang="ar" class="h-100" dir="rtl">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>متجر كتب</title>
  <script defer src="{% static 'js/830.66d67bb4.js' %}"></script>
  <script defer src="{% static 'js/app.2fe33112.js' %}"></script>
  <link href="{% static 'css/830.css' %}" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
  
  <!-- Add Google Fonts: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome for modern icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- AOS for smooth animations -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #0d6efd;
      --primary-gradient: linear-gradient(135deg, #0d6efd, #6610f2);
      --bg-color: #f4f6f9;
      --text-color: #212529;
      --card-bg: #ffffff;
      --card-hover-y: -8px;
      --transition-speed: 0.35s;
      --slider-bg: linear-gradient(135deg, #e3f0ff 0%, #f0e6ff 100%);
      --nav-cat-bg: var(--primary-color);
      --search-bg: #ffffff;
      --select-bg: #f8f9fa;
      --border-subtle: rgba(0,0,0,0.08);
    }

    [data-theme="dark"] {
      --primary-color: #5b9dff;
      --primary-gradient: linear-gradient(135deg, #3d8bfd, #7c3aed);
      --bg-color: #0f1117;
      --text-color: #e0e0e0;
      --card-bg: #1a1d27;
      --slider-bg: linear-gradient(135deg, #151820 0%, #1a1530 100%);
      --nav-cat-bg: #1a1d27;
      --search-bg: #1a1d27;
      --select-bg: #22252f;
      --border-subtle: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Cairo', sans-serif !important;
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      transition: background-color var(--transition-speed) ease,
                  color var(--transition-speed) ease;
      line-height: 1.8;
      letter-spacing: 0.01em;
    }

    /* ── GLOBAL DARK MODE ────────────────────────── */
    [data-theme="dark"] .bg-light,
    [data-theme="dark"] .bg-white {
      background-color: var(--card-bg) !important;
      border-color: var(--border-subtle) !important;
    }
    [data-theme="dark"] .text-secondary { color: #cbd5e1 !important; }
    [data-theme="dark"] .text-muted    { color: #94a3b8 !important; }

    [data-theme="dark"] .navbar-light .navbar-brand,
    [data-theme="dark"] .navbar-light .nav-link,
    [data-theme="dark"] .navbar-nav .nav-link {
      color: var(--text-color) !important;
    }
    [data-theme="dark"] .card {
      background-color: var(--card-bg) !important;
      border-color: var(--border-subtle) !important;
      color: var(--text-color) !important;
    }
    [data-theme="dark"] .card-title,
    [data-theme="dark"] .card-text {
      color: var(--text-color) !important;
    }
    [data-theme="dark"] .table { color: var(--text-color); }
    [data-theme="dark"] .list-group-item {
      background-color: var(--card-bg);
      border-color: var(--border-subtle);
      color: var(--text-color);
    }
    [data-theme="dark"] .list-group-item.active {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
    [data-theme="dark"] .border-bottom { border-color: var(--border-subtle) !important; }
    [data-theme="dark"] .navbar-toggler-icon {
      filter: invert(1);
    }
    [data-theme="dark"] .nav-pills .nav-link.active {
      background: var(--primary-gradient);
    }
    [data-theme="dark"] .nav-pills .nav-link:not(.active) {
      color: var(--text-color) !important;
    }

    /* ── CATEGORY SIDEBAR ─────────────────────────── */
    .cat-sidebar .list-group {
      border-radius: 16px;
      overflow: hidden;
      border: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .cat-sidebar .list-group-item {
      border: none;
      border-bottom: 1px solid var(--border-subtle);
      padding: 14px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      background: var(--card-bg);
      color: var(--text-color);
    }
    .cat-sidebar .list-group-item:last-child {
      border-bottom: none;
    }
    .cat-sidebar .list-group-item:hover:not(.active) {
      background: rgba(13,110,253,0.06);
      color: var(--primary-color);
      padding-right: 28px;
    }
    .cat-sidebar .list-group-item.active {
      background: var(--primary-gradient);
      color: #fff;
      border: none;
    }
    .cat-sidebar .list-group-item i {
      opacity: 0.7;
    }

    /* ── AUTHOR PROFILE CARD ──────────────────────── */
    .author-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .author-avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--primary-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #fff;
      flex-shrink: 0;
    }

    /* ── PRODUCT DETAIL CARD ──────────────────────── */
    .product-detail-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 4px 25px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .product-detail-card img {
      border-radius: 16px;
      object-fit: cover;
    }
    .nav-pills .nav-link {
      border-radius: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    .nav-pills .nav-link.active {
      background: var(--primary-gradient);
    }

    /* ── RESPONSIVE ───────────────────────────────── */
    @media (max-width: 768px) {
      .search-bar { width: 100%; }
      .search-bar input { min-width: auto !important; width: 100% !important; }
      .search-bar select { max-width: 120px !important; }
      .main-slider h1 { font-size: 1.3rem; }
      .section-title { font-size: 1.3rem; }
      .category-nav .nav-link { font-size: 0.82rem; padding: 5px 10px !important; }
    }
    @media (max-width: 576px) {
      .product.card { border-radius: 14px; }
      .cat-sidebar { margin-bottom: 24px; }
    }

    /* ── SLIDER ──────────────────────────────────── */
    .main-slider {
      background: var(--slider-bg);
      padding: 30px 0 40px 0;
      margin-bottom: 0;
      transition: background var(--transition-speed) ease;
      border-bottom: none !important;
    }
    .main-slider .swiper-slide {
      border-radius: 0;
      overflow: visible;
    }
    .main-slider h1 {
      font-weight: 700;
      font-size: 1.8rem;
    }
    .main-slider .swiper-pagination-bullet-active {
      background: var(--primary-color);
    }

    /* ── SECTION SEPARATOR ───────────────────────── */
    .section-title {
      font-weight: 700;
      font-size: 1.6rem;
      position: relative;
      display: inline-block;
      padding-bottom: 12px;
    }
    .section-title::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 50%;
      transform: translateX(50%);
      width: 60px;
      height: 4px;
      border-radius: 2px;
      background: var(--primary-gradient);
    }

    /* ── CARDS ────────────────────────────────────── */
    .product.card {
      border: none;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      transition: transform var(--transition-speed) cubic-bezier(.4,0,.2,1),
                  box-shadow var(--transition-speed) cubic-bezier(.4,0,.2,1);
    }
    .product.card:hover {
      transform: translateY(var(--card-hover-y));
      box-shadow: 0 18px 40px rgba(0,0,0,0.13);
    }
    .product.card .card-img-overlay {
      opacity: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(3px);
      transition: opacity var(--transition-speed) ease;
    }
    .product.card:hover .card-img-overlay {
      opacity: 1;
    }

    /* ── BUTTONS ──────────────────────────────────── */
    .btn {
      border-radius: 10px;
      font-weight: 600;
      transition: all 0.25s ease;
    }
    .btn:hover {
      transform: scale(1.03);
    }
    .btn-primary {
      background: var(--primary-gradient) !important;
      border: none !important;
      color: #ffffff !important;
    }
    .btn-primary:hover {
      filter: brightness(1.1);
    }
    [data-theme="dark"] .btn-outline-secondary {
      color: #cbd5e1 !important;
      border-color: #64748b !important;
    }
    [data-theme="dark"] .btn-outline-secondary:hover {
      background: #64748b !important;
      color: #ffffff !important;
    }
    [data-theme="dark"] .btn-outline-primary {
      color: #5b9dff !important;
      border-color: #5b9dff !important;
    }
    [data-theme="dark"] .btn-outline-primary:hover {
      background: #5b9dff !important;
      color: #ffffff !important;
    }

    /* ── CATEGORY NAV BAR ────────────────────────── */
    .category-nav {
      background: var(--nav-cat-bg) !important;
      transition: background var(--transition-speed) ease;
      border: none !important;
      padding: 6px 0;
    }
    .category-nav .nav-link {
      color: rgba(255,255,255,0.85) !important;
      font-weight: 600;
      font-size: 0.92rem;
      border-radius: 8px;
      padding: 6px 16px !important;
      transition: all 0.25s ease;
    }
    .category-nav .nav-link:hover {
      background: rgba(255,255,255,0.15);
      color: #fff !important;
      transform: translateY(-2px);
    }

    /* ── SEARCH BAR ──────────────────────────────── */
    .search-bar {
      background: var(--search-bg);
      border: 2px solid var(--border-subtle);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,0.04);
      transition: border-color 0.3s ease, box-shadow 0.3s ease,
                  background 0.3s ease;
    }
    .search-bar:focus-within {
      border-color: var(--primary-color);
      box-shadow: 0 4px 20px rgba(13,110,253,0.12);
    }
    .search-bar input,
    .search-bar select {
      border: none !important;
      background: transparent !important;
      color: var(--text-color) !important;
      font-family: 'Cairo', sans-serif !important;
      outline: none !important;
      box-shadow: none !important;
    }
    .search-bar input::placeholder { color: #aaa; }
    .search-bar select {
      background: var(--select-bg) !important;
      border-right: 2px solid var(--border-subtle) !important;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .search-bar select option {
      background: var(--card-bg);
      color: var(--text-color);
      padding: 8px;
    }
    .search-bar .btn-primary {
      border-radius: 0 12px 12px 0;
      padding: 10px 22px;
    }

    /* ── FORMS IN DARK MODE ───────────────────────── */
    [data-theme="dark"] .form-control,
    [data-theme="dark"] .form-select {
      background-color: var(--select-bg) !important;
      color: #ffffff !important;
      border-color: var(--border-subtle) !important;
    }
    [data-theme="dark"] .form-control.bg-transparent {
      background-color: transparent !important;
    }
    [data-theme="dark"] .form-control::placeholder,
    [data-theme="dark"] .checkout-input::placeholder {
      color: #94a3b8 !important;
      opacity: 0.8 !important;
    }
    /* Fix focus color in ALL themes — no black border */
    .form-control:focus,
    .form-select:focus {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 0 3px rgba(13,110,253,0.15) !important;
      outline: none !important;
    }
    [data-theme="dark"] .form-control:focus,
    [data-theme="dark"] .form-select:focus {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 0 3px rgba(91,157,255,0.2) !important;
      background-color: var(--select-bg) !important;
      color: var(--text-color) !important;
    }

    /* ── FOOTER ──────────────────────────────────── */
    .site-footer {
      background: var(--primary-gradient) !important;
      transition: background var(--transition-speed) ease;
      border: none;
    }
    [data-theme="dark"] .site-footer {
      background: linear-gradient(135deg, #0a0c12, #12101f) !important;
    }

    /* ── THEME TOGGLE ────────────────────────────── */
    .theme-toggle-btn {
      background: none;
      border: 2px solid var(--border-subtle);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      cursor: pointer;
      color: inherit;
      transition: all 0.3s ease;
      overflow: hidden;
    }
    .theme-toggle-btn:hover {
      background: rgba(13,110,253,0.1);
      border-color: var(--primary-color);
      transform: scale(1.1);
    }
    .theme-icon-anim {
      animation: spinIcon 0.5s ease-out;
    }
    @keyframes spinIcon {
      0% { transform: rotate(-90deg) scale(0.5); opacity: 0; }
      100% { transform: rotate(0) scale(1); opacity: 1; }
    }

    /* ── CART ITEM ────────────────────────────────── */
    .cart-item {
      border-radius: 16px;
      border: none;
      box-shadow: 0 2px 12px rgba(0,0,0,0.05);
      transition: all 0.3s ease;
    }
    .cart-item:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
    .empty-cart-icon {
      font-size: 5rem;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── SCROLLBAR ────────────────────────────────── */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-color);
      border-radius: 4px;
    }

    /* ── SMOOTH SCROLL ───────────────────────────── */
    html { scroll-behavior: smooth; }

    /* ── ORDER SUMMARY CARD ──────────────────────── */
    .order-summary-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1.5px solid var(--border-subtle);
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
      transition: background var(--transition-speed) ease,
                  border-color var(--transition-speed) ease;
    }
    .total-price {
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ── CHECKOUT PAGE ───────────────────────────── */
    .checkout-card {
      background: var(--card-bg);
      border-radius: 20px;
      border: 1.5px solid var(--border-subtle);
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      overflow: hidden;
      transition: background var(--transition-speed) ease;
    }
    .checkout-card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 20px 24px;
      border-bottom: 1.5px solid var(--border-subtle);
      background: rgba(13,110,253,0.03);
    }
    [data-theme="dark"] .checkout-card-header {
      background: rgba(91,157,255,0.04);
    }
    .checkout-card-body {
      padding: 24px;
    }
    .checkout-step-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .checkout-label {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-color);
      margin-bottom: 6px;
    }
    .checkout-input {
      background: var(--bg-color) !important;
      color: var(--text-color) !important;
      border: 1.5px solid var(--border-subtle) !important;
      border-radius: 10px !important;
      padding: 10px 14px !important;
      font-family: 'Cairo', sans-serif !important;
      transition: border-color 0.25s ease, box-shadow 0.25s ease !important;
    }
    [data-theme="dark"] .checkout-input {
      background: var(--card-bg) !important;
      color: #ffffff !important;
    }
    .checkout-input:focus {
      border-color: var(--primary-color) !important;
      box-shadow: 0 0 0 3px rgba(13,110,253,0.12) !important;
      outline: none !important;
    }
    .checkout-input::placeholder {
      color: #999 !important;
    }
    .payment-option {
      border: 2px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: var(--bg-color);
      color: var(--text-color);
    }
    .payment-option:hover {
      border-color: var(--primary-color);
      background: rgba(13,110,253,0.04);
      transform: translateY(-3px);
    }
    .payment-option.active {
      border-color: var(--primary-color);
      background: rgba(13,110,253,0.08);
      box-shadow: 0 4px 16px rgba(13,110,253,0.15);
    }

    /* ── PRELOADER ───────────────────────────────── */
    #preloader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(13,110,253,0.2);
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spinLoader 1s infinite linear;
    }
    @keyframes spinLoader {
      100% { transform: rotate(360deg); }
    }

    /* ── SCROLL TO TOP ───────────────────────────── */
    #scrollToTopBtn {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: var(--primary-gradient);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.3s ease;
      z-index: 1000;
    }
    #scrollToTopBtn.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    #scrollToTopBtn:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 25px rgba(13,110,253,0.3);
    }

    /* ── GLASS NAVBAR ────────────────────────────── */
    .glass-navbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--border-subtle);
      transition: background 0.3s ease;
      z-index: 1030;
    }
    [data-theme="dark"] .glass-navbar {
      background: rgba(26, 29, 39, 0.85) !important;
    }

    /* ── FOOTER SOCIAL HOVER ─────────────────────── */
    .social-icon {
      transition: transform 0.3s ease, color 0.3s ease;
    }
    .social-icon:hover {
      transform: translateY(-4px) scale(1.1);
      color: var(--primary-color) !important;
    }
    .footer-link {
      transition: color 0.3s ease;
    }
    .footer-link:hover {
      color: #fff !important;
    }

    /* ── TOAST NOTIFICATIONS ─────────────────────── */
    .toast-container {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 1055;
    }
    .custom-toast {
      background: var(--card-bg);
      color: var(--text-color);
      border-right: 5px solid var(--primary-color);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      padding: 16px 20px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      opacity: 0;
      transform: translateX(50px);
      animation: slideInToast 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .custom-toast.hide {
      animation: slideOutToast 0.4s ease forwards;
    }
    @keyframes slideInToast {
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideOutToast {
      100% { opacity: 0; transform: translateX(50px); }
    }
  </style>

  <script>
    // Execute early to prevent flash
    let savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>

<body class="d-flex flex-column h-100 bg-light">
    <!-- Preloader -->
    <div id="preloader">
      <div class="spinner"></div>
    </div>
    {% include 'partials/header.html' %}
    <main>
        {% block content %}
        {% endblock %}
    </main>
    {% include 'partials/footer.html' %}

    <!-- Scroll to Top Button -->
    <button id="scrollToTopBtn" title="العودة للأعلى">
      <i class="fa-solid fa-arrow-up"></i>
    </button>

    <!-- Toasts Container -->
    <div class="toast-container" id="toastBox">
      {% if messages %}
        {% for message in messages %}
          <div class="custom-toast">
            <i class="fa-solid fa-bell text-primary fs-5"></i>
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endif %}
    </div>
    
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({ once: true, duration: 600, easing: 'ease-out-quad', offset: 60 });
      
      document.addEventListener('DOMContentLoaded', () => {
        const themeToggleBtn = document.getElementById('theme-toggle');
        const updateThemeIcon = (theme) => {
          if(themeToggleBtn) {
            themeToggleBtn.innerHTML = theme === 'dark' 
                ? '<i class="fa-solid fa-moon theme-icon-anim" style="color:#fbbf24"></i>' 
                : '<i class="fa-solid fa-sun theme-icon-anim" style="color:#f5b041"></i>';
          }
        };

        if (themeToggleBtn) {
          themeToggleBtn.addEventListener('click', () => {
            let currentTheme = document.documentElement.getAttribute('data-theme');
            let newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
          });
        }

        let savedTheme = localStorage.getItem('theme') || 'light';
        updateThemeIcon(savedTheme);

        // Preloader
        window.addEventListener('load', () => {
          const preloader = document.getElementById('preloader');
          if (preloader) {
            preloader.style.opacity = '0';
            setTimeout(() => preloader.style.display = 'none', 500);
          }
        });

        // Scroll to Top
        const scrollBtn = document.getElementById('scrollToTopBtn');
        window.addEventListener('scroll', () => {
          if (window.scrollY > 300) {
            scrollBtn.classList.add('show');
          } else {
            scrollBtn.classList.remove('show');
          }
        });
        if (scrollBtn) {
          scrollBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          });
        }

        // Auto-hide Toasts
        const toasts = document.querySelectorAll('.custom-toast');
        toasts.forEach(toast => {
          setTimeout(() => {
            toast.classList.add('hide');
            setTimeout(() => toast.remove(), 400); // Wait for animation
          }, 4000);
        });

      });
    </script>
</body>
</html>
